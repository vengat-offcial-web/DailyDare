{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Dare</title>
    <link rel="stylesheet" href="{% static 'css/active_dare.css' %}">
</head>
<body>

    <div class="card">
        <div class="badge">ACTIVE DARE</div>
        
        <h1 class="title">{{ user_challenge.challenge.title }}</h1>
        <p class="description">{{ user_challenge.challenge.description }}</p>

        <div class="timer-box">
            <span class="timer-label">Time Remaining</span>
            <div class="timer-display" id="timer">--:--</div>
        </div>

        <div class="points">
            +{{ user_challenge.challenge.points }} XP
        </div>

        <div class="btn-group">
            <a href="#" class="btn btn-giveup">GIVE UP</a>
            <a href="#" class="btn btn-accept">COMPLETE</a> 
        </div>
    </div>

</body>
</html>
